    <h1>为日常开发准备的快速工具箱。</h1>
    <p class="lead">ToolkitBox 收集 JSON、Base64、UUID、正则、文本对比、URL、SSL 证书、颜色等常用工具。</p>
    <section class="panel"><h2>我们在做什么</h2><p>每个工具都尽量打开快、操作清楚、无需账号。多数处理都在浏览器本地完成，减少把片段、载荷和测试数据发到服务器的需要。</p></section>
    <section class="panel"><h2>站点结构</h2><p>主域名是开发者工具导航页，具体工具放在 json.toolkitbox.org、base64.toolkitbox.org、ssl.toolkitbox.org 等子域名。</p></section>
